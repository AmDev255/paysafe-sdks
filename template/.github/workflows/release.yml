name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build package artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
{{RELEASE_SETUP}}
      - name: Build package
        run: |
{{RELEASE_BUILD}}
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: {{RELEASE_ARTIFACT}}

  # Publishing is intentionally disabled. Enable the job and add the registry credentials as
  # repository secrets only after PaySafe approves the release.
  publish:
    name: Publish (disabled)
    needs: build
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Publish
        run: echo "{{PUBLISH_COMMAND}}"
